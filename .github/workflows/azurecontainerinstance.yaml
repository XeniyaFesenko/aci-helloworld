name: Docker Image Build

on:
  push:
    branches: 
      - xeniya
      - main
  workflow_dispatch:


env:
    ARM_CLIENT_ID: ${{ vars.ARM_CLIENT_ID }}
    ARM_TENANT_ID: ${{ vars.ARM_TENANT_ID }}
    ARM_CLIENT_SECRET: ${{ vars.ARM_CLIENT_SECRET }}
    ARM_SUBSCRIPTION_ID: ${{ vars.ARM_SUBSCRIPTION_ID }}
    ACR_PASSWORD: ${{ secrets.ACR_PASSWORD_XF }}
    ACR_USERNAME: ${{ vars.ACR_USERNAME_XF }}
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    #- name: ACR Login
    #  uses: azure/docker-login@v2
    #  with:
    #        login-server: "${{ env.ACR_USERNAME }}$.azurecr.us"
    #        username: $ACR_USERNAME
    #        password: $ACR_PASSWORD
    
    - name: ACR Login
      run: |
        az cloud set --name AzureUSGovernment
        az login --service-principal -u $ARM_CLIENT_ID -p $ARM_CLIENT_SECRET --tenant $ARM_TENANT_ID
        az account set -s $ARM_SUBSCRIPTION_ID
        az acr login -n $ACR_USERNAME
    
    - name: Build the Docker image
      run: docker build . -t ${{ env.ACR_USERNAME }}.azurecr.us/${{ env.REPO }} -t ${{ env.ACR_USERNAME }}.azurecr.us/${{ env.REPO }}:v1
          
    - name: Push the Docker image
      run: docker push -a ${{ env.ACR_USERNAME }}.azurecr.us/${{ env.REPO }}

  deploy:
     name: "Deploy Document-Conversion Container Instance"
     runs-on: ubuntu-latest
     needs: build
     steps:
                  
        - uses: actions/checkout@v4
                  
        - name: Update instance.yaml
          run : |
            sed -i "s/pswd/${{ env.ACR_PASSWORD }}/g" instance.yaml
            #cat instance.yaml
          working-directory: ContainerGroup
                  
        #- name: ACR Login
        #  uses: azure/docker-login@v2
        #  with:
        #    login-server: "${{ env.ACR_USERNAME }}$.azurecr.us"
        #    username: $ACR_USERNAME
        #    password: $ACR_PASSWORD
            
        - name: ACR Login
          run: |
            az cloud set --name AzureUSGovernment
            az login --service-principal -u $ARM_CLIENT_ID -p $ARM_CLIENT_SECRET --tenant $ARM_TENANT_ID
            az account set -s $ARM_SUBSCRIPTION_ID
            az acr login -n $ACR_USERNAME

        - name: Build and deploy Container App
          uses: azure/container-apps-deploy-action@v1
          with:
            appSourcePath: ${{ github.workspace }}
            acrName: xeniya001
            resourceGroup: EIS_DEVTEST-INT-EAST-SANDBOX-RG  
            containerAppName: poc-container-app
            registryUrl: mytestregistry.dockerhub.io
            registryUsername: ${{ vars.ACR_USERNAME_XF }}
            registryPassword: ${{ secrets.ACR_PASSWORD_XF }}
            yamlConfigPath: simple-image-container-app.yaml