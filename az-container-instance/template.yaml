      - image: docker-documentconversion:GITHUB_SHA_PLACEHOLDER
        name: test-container-app
    scale:
      minReplicas: 1
      maxReplicas: 5
      rules:
      - name: httpscalingrule
        custom:
          type: http
          metadata:
            concurrentRequests: '50'        